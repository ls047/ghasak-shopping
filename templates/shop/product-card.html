        <article class="card product-card">
            {{product_media}}
            <div class="product-body">
                <h2>{{name}}</h2>
                <p class="product-meta"><i class="fa-solid fa-box-open"></i> In stock: {{stock}}</p>
                <p class="product-desc">{{description}}</p>
                <p class="price"><i class="fa-solid fa-tag"></i> {{price}}</p>
                {{buy_block}}
            </div>
        </article>
