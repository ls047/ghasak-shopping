                <form method="post" class="add-form">
                    <input type="hidden" name="add_product_id" value="{{id}}">
                    <label class="qty-label">
                        <i class="fa-solid fa-hashtag" aria-hidden="true"></i> Qty
                        <input type="number" name="qty" value="1" min="1" max="{{max_qty}}">
                    </label>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-cart-plus"></i> Add to cart</button>
                </form>
